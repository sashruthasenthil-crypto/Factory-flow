{% extends "base.html" %}{% block page_heading %}Purchase receipt{% endblock %}{% block content %}
<div class="page-intro"><div><span class="eyebrow">PROCUREMENT</span><h2>Receive raw material</h2><p>Post received quantities into the stock ledger.</p></div></div>
<div class="panel-card form-narrow"><form method="post" class="row g-3"><div class="col-12"><label>Raw material</label><select class="form-select" name="material">{% for m in materials %}<option value="{{ m.name }}">{{ m.name }} ({{ m.unit }})</option>{% endfor %}</select></div><div class="col-md-6"><label>Quantity received</label><input class="form-control" name="quantity" type="number" step=".01" value="60" required></div><div class="col-md-6"><label>Rate per unit (₹)</label><input class="form-control" name="rate" type="number" step=".01" value="45" required></div><div class="col-12"><button class="btn btn-primary">Save purchase receipt</button></div></form><div class="hint mt-3"><i class="bi bi-info-circle"></i> Benchmark: receive 60 kg flour at ₹45/kg.</div></div>
{% endblock %}
